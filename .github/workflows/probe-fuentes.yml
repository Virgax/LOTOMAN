name: Sonda de fuentes

# Diagnóstico manual. NO toca la base ni commitea nada.
# Existe porque desde el contenedor de Claude Code todas las fuentes de lotería
# están bloqueadas por la política de egress; desde el runner sí se llega.

on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días alrededor del ancla (id 6248 = 2026-06-24) a pedir'
        required: false
        default: '6'
        type: string

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Sondear
        env:
          DIAS: ${{ inputs.dias }}
        run: |
          set -euo pipefail
          DIAS="${DIAS:-6}"
          [[ "$DIAS" =~ ^[0-9]{1,2}$ ]] \
            || { echo "::error::dias inválido: $DIAS"; exit 1; }
          python scripts/probe_fuentes.py --dias "$DIAS" --salida probe \
            2>&1 | tee probe.log

      - name: VEREDICTO
        if: always()
        run: |
          echo '================= VEREDICTO ================='
          cat veredicto.txt 2>/dev/null || echo '(la sonda no llegó a escribirlo)'
          echo '============================================'

      # El reporte se commitea para poder leerlo sin escarbar el log del job.
      - name: Commitear el reporte
        if: always()
        run: |
          set -euo pipefail
          [[ -f probe/REPORTE.md ]] || { echo 'sin reporte'; exit 0; }
          git config user.name  'athena-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f probe/REPORTE.md
          git diff --cached --quiet && { echo 'reporte sin cambios'; exit 0; }
          git commit -m 'sonda: reporte de fuentes'
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((i * 4))
          done
          echo '::error::no se pudo pushear el reporte'; exit 1

      - name: Publicar en el resumen del job
        if: always()
        run: |
          {
            echo '## Resumen'
            echo '```'
            sed -n '/@@ RESUMEN @@/,$p' probe.log 2>/dev/null || echo '(sin resumen)'
            echo '```'
            echo '<details><summary>log completo</summary>'
            echo
            echo '```'
            head -c 60000 probe.log 2>/dev/null || echo '(sin log)'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: respuestas-crudas
          path: |
            probe/
            probe.log
            veredicto.txt
          retention-days: 7
