name: Sonda de fuentes

# Diagnóstico manual. NO toca la base ni commitea nada.
# Existe porque desde el contenedor de Claude Code todas las fuentes de lotería
# están bloqueadas por la política de egress; desde el runner sí se llega.

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a investigar (YYYY-MM-DD)'
        required: false
        default: '2026-06-23'
        type: string
      kino_id:
        description: 'ID de la página oficial de Leidsa para esa fecha'
        required: false
        default: '6247'
        type: string

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Sondear
        env:
          FECHA: ${{ inputs.fecha }}
          KINO_ID: ${{ inputs.kino_id }}
        run: |
          set -euo pipefail
          [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || { echo "::error::fecha inválida: $FECHA"; exit 1; }
          [[ "$KINO_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::kino_id inválido: $KINO_ID"; exit 1; }
          python scripts/probe_fuentes.py \
            --fecha "$FECHA" --kino-id "$KINO_ID" --salida probe \
            2>&1 | tee probe.log

      - name: Publicar en el resumen del job
        if: always()
        run: |
          {
            echo '```'
            head -c 60000 probe.log 2>/dev/null || echo '(sin log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: respuestas-crudas
          path: |
            probe/
            probe.log
          retention-days: 7
