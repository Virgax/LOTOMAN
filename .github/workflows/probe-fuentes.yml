name: Sonda de fuentes

# Diagnóstico manual. NO toca la base ni commitea nada.
# Existe porque desde el contenedor de Claude Code todas las fuentes de lotería
# están bloqueadas por la política de egress; desde el runner sí se llega.

on:
  workflow_dispatch:
    inputs:
      kino_ids:
        description: 'IDs de Leidsa KinoTV a pedir, separados por coma'
        required: false
        default: '6247,6248,6244'
        type: string

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Sondear
        env:
          KINO_IDS: ${{ inputs.kino_ids }}
        run: |
          set -euo pipefail
          KINO_IDS="${KINO_IDS:-6247,6248,6244}"
          [[ "$KINO_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]] \
            || { echo "::error::kino_ids inválido: $KINO_IDS"; exit 1; }
          python scripts/probe_fuentes.py \
            --kino-ids "$KINO_IDS" --salida probe 2>&1 | tee probe.log

      - name: Publicar en el resumen del job
        if: always()
        run: |
          {
            echo '## Resumen'
            echo '```'
            sed -n '/@@ RESUMEN @@/,$p' probe.log 2>/dev/null || echo '(sin resumen)'
            echo '```'
            echo '<details><summary>log completo</summary>'
            echo
            echo '```'
            head -c 60000 probe.log 2>/dev/null || echo '(sin log)'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: respuestas-crudas
          path: |
            probe/
            probe.log
          retention-days: 7
